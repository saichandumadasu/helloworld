name: CI for my hello world project
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        #git clone your repository
        #cd your-repo
      - name: list checkout files
        run: ls -alrt

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # secrets.DOCKER_USERNAME and secrets.DOCKER_PASSWORD are set in the repository settings where 
        # the process to add secrets is Settings -> Secrets and variables -> Actions -> New repository secret 
        # once you have added the secrets, you can use them in your workflow as shown above
        
      - name: timestamp tag
        id: timestamp
        run: |
         echo "TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
         printenv
      # need to go inside hello-server directory to build the docker image
      - name: build docker image
        run: |
          cd hello-service
          ls -lart
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hello-world:${{ env.TAG }} .
          docker images
      - name: push docker image
        run: |
          cd hello-service
          docker images
          docker tag ${{ secrets.DOCKER_USERNAME }}/hello-world:${{ env.TAG }} ${{ secrets.DOCKER_USERNAME }}/hello-world:${{ env.TAG }}
          docker images
          docker push ${{ secrets.DOCKER_USERNAME }}/hello-world:${{ env.TAG }}

